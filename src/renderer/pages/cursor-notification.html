<!-- cursor-notification.html -->
<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
        width: 220px;
        height: 60px;
        color: black;
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
      }

      .notification {
        background: linear-gradient(135deg, #f06eaa 0%, #9e2c6b 100%);
        color: white;
        padding: 12px 16px;
        border-radius: 12px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
        font-size: 14px;
        -webkit-font-smoothing: antialiased;
        font-variant-numeric: tabular-nums;
        display: flex;
        align-items: center;
        gap: 8px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08), 0 4px 12px rgba(0, 0, 0, 0.12);
        animation: fadeIn 250ms cubic-bezier(0.23, 1, 0.32, 1);
        width: fit-content;
        white-space: nowrap;
      }

      .notification.fade-out {
        animation: fadeOut 200ms cubic-bezier(0.23, 1, 0.32, 1) forwards;
      }

      .icon {
        width: 24px;
        height: 24px;
        background: #ffa5d0;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(8px) scale(0.97);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes fadeOut {
        from {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
        to {
          opacity: 0;
          transform: translateY(-8px) scale(0.97);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="notification">
      <div class="icon">😴</div>
      <span>Starting break in <span id="countdown">10</span></span>
    </div>

    <script>
      let count = 10;
      let interval = null;
      const countdownElement = document.getElementById("countdown");
      const notification = document.querySelector(".notification");

      function startCountdown() {
        countdownElement.textContent = count;
        interval = setInterval(() => {
          count--;
          countdownElement.textContent = count;

          if (count <= 0) {
            clearInterval(interval);
            notification.classList.add("fade-out");
            setTimeout(() => {
              window.electronAPI.closeNotification();
            }, 300);
          }
        }, 1000);
      }

      // Receive countdown duration from main process
      window.electronAPI.onSetCountdown((seconds) => {
        count = seconds;
        countdownElement.textContent = count;
        startCountdown();
      });

      // Fallback: start after a short delay if no message received
      setTimeout(() => {
        if (!interval) startCountdown();
      }, 500);

      // Cleanup on window close
      window.addEventListener("unload", () => {
        if (interval) clearInterval(interval);
      });
    </script>
  </body>
</html>
