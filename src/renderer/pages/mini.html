<!DOCTYPE html>
<html>
  <head>
    <title>Break Flow Widget</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        background: transparent;
        color: white;
        -webkit-app-region: drag;
        cursor: default;
        overflow: hidden;
      }

      .widget {
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(30, 30, 40, 0.92);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-radius: 24px;
        padding: 8px 16px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.06);
        cursor: pointer;
        -webkit-app-region: drag;
        transition: background-color 200ms ease;
      }

      .widget:hover {
        background: rgba(40, 40, 55, 0.95);
      }

      .state-icon {
        font-size: 14px;
        line-height: 1;
        flex-shrink: 0;
      }

      .widget-timer {
        font-size: 18px;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.5px;
      }

      .widget-timer .timer-char {
        display: inline-block;
        transition: opacity 200ms cubic-bezier(0.23, 1, 0.32, 1), transform 200ms cubic-bezier(0.23, 1, 0.32, 1);
      }

      .status-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        flex-shrink: 0;
      }

      .status-dot.working { background: #43b581; }
      .status-dot.break { background: #faa61a; }
      .status-dot.paused { background: #747f8d; }
      .status-dot.meeting { background: #ed4245; }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="widget" id="widget">
      <div class="status-dot working" id="statusDot"></div>
      <div class="widget-timer" id="timer">20:00</div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const timerEl = document.getElementById("timer");
        const statusDot = document.getElementById("statusDot");
        const widget = document.getElementById("widget");

        // Click to show main window
        widget.addEventListener("click", () => {
          window.electronAPI.showMain();
        });

        // Listen for timer updates
        window.electronAPI.onTimerUpdate((event, data) => {
          // Update timer display with animation
          const newTime = data.time;
          if (!timerEl.children.length) {
            timerEl.innerHTML = newTime
              .split("")
              .map(char => `<span class="timer-char">${char}</span>`)
              .join("");
          }

          const chars = timerEl.children;
          newTime.split("").forEach((char, i) => {
            if (chars[i] && chars[i].textContent !== char) {
              chars[i].style.opacity = "0";
              chars[i].style.transform = "scale(0.92)";
              setTimeout(() => {
                chars[i].textContent = char;
                chars[i].style.opacity = "1";
                chars[i].style.transform = "scale(1)";
              }, 150);
            }
          });

          // Update status dot
          statusDot.className = "status-dot";
          if (data.inMeeting || data.pauseReason === "meeting") {
            statusDot.classList.add("meeting");
          } else if (data.isPaused) {
            statusDot.classList.add("paused");
          } else if (data.isWorking) {
            statusDot.classList.add("working");
          } else {
            statusDot.classList.add("break");
          }
        });
      });
    </script>
  </body>
</html>
